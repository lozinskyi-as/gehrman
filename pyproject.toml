[project]
name = "gehrman"
version = "0.1.0"
description = "CLI assistant that helps bug bounty researchers choose programs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andrew Lozinskyi" }]
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.0",
    "rich>=13.7",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
gehrman = "gehrman.cli:app"
gehrman-eval = "gehrman_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gehrman", "src/gehrman_eval"]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "cyclonedx-bom>=5.0",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Opt in with `uv sync --group eval` to install the harness dependencies.
# Kept separate so plain `uv run gehrman ...` stays lean.
eval = [
    "ruamel.yaml>=0.18",
]

[tool.uv]
# Don't pull dev or eval groups on plain `uv run gehrman ...`.
default-groups = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is prose. Wrapping the lines would change the bytes the model sees.
"src/gehrman/agent/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval_tests"]
addopts = ["-q"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
